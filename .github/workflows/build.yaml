name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          unzip -q "$(ls *.zip | head -1)"
          PROJ=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "PROJ=$GITHUB_WORKSPACE/${PROJ#./}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Build sing-box core (libbox.aar)
        run: |
          git clone --depth 1 --branch v1.11.15 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android
          mkdir -p "$PROJ/app/libs"
          cp libbox.aar "$PROJ/app/libs/libbox.aar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VpnBest-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
